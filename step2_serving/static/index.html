<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    #preview { max-width: 100%; max-height: 320px; margin: 16px 0; border-radius: 8px; display: none; }
    .row { margin: 10px 0; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; margin-top: 4px; }
    .fill { height: 100%; background: #2563eb; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Image Classifier (ResNet-50)</h1>
  <p>Upload a photo and the model will guess what's in it, out of 1000 ImageNet categories.</p>
  <input type="file" id="file" accept="image/*">
  <img id="preview" alt="">
  <div id="results"></div>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const results = document.getElementById("results");

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      results.textContent = "Classifying...";

      const form = new FormData();
      form.append("file", file);
      const response = await fetch("/predict", { method: "POST", body: form });
      const body = await response.json();

      if (!response.ok) {
        results.innerHTML = `<p class="error">${body.detail}</p>`;
        return;
      }
      results.innerHTML = body.predictions.map(p => `
        <div class="row">
          <strong>${p.label}</strong> - ${(p.probability * 100).toFixed(1)}%
          <div class="bar"><div class="fill" style="width:${p.probability * 100}%"></div></div>
        </div>`).join("");
    });
  </script>
</body>
</html>
